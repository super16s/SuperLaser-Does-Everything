name: Fetch NGS data

on:
  schedule:
    # Tuesdays at 09:00 UTC, after the weekly nflverse NGS data refresh
    - cron: "0 9 * * 2"
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node scripts/fetch-ngs.js

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ngs-latest.csv
          git diff --cached --quiet || git commit -m "chore: update NGS data"
          git push
