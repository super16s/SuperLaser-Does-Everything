<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Image Studio</title>
<meta name="theme-color" content="#2f6fed" />
<meta name="description" content="Generate images with Fooocus." />
<link rel="manifest" href="/manifest.json" />
<link rel="icon" href="/icons/icon-192.png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="SuperLaser" />
<style>
  :root { color-scheme: light dark; --border: #d8d8d8; --muted: #6b6b6b; --accent: #2f6fed; --bg-card: #fff; --bg-page: #f6f6f7; }
  @media (prefers-color-scheme: dark) { :root { --border: #3a3a3a; --muted: #9a9a9a; --bg-card: #1e1e1f; --bg-page: #121212; } }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg-page); color: inherit; }
  main { max-width: 720px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 1.25rem; margin: 0 0 12px; }
  form { display: flex; gap: 8px; flex-wrap: wrap; }
  input[type="text"] { flex: 1; min-width: 180px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; background: var(--bg-card); color: inherit; }
  button { padding: 10px 18px; border: none; border-radius: 8px; background: var(--accent); color: #fff; font-size: 1rem; cursor: pointer; }
  button:disabled { opacity: 0.6; cursor: default; }
  #logout { justify-content: flex-end; }
  #logout button { background: none; color: var(--muted); padding: 0; font-size: 0.8rem; }
  #image-status { color: var(--muted); font-size: 0.85rem; margin: 10px 0; }
  #image-results img { max-width: 100%; border-radius: 8px; margin-top: 8px; }
</style>
</head>
<body>
<main>
  <form id="logout" method="POST" action="/logout"><button type="submit">Log out</button></form>
  <h1>Image Studio</h1>
  <form id="image-form">
    <input type="text" id="image-prompt" placeholder="Describe an image…" autocomplete="off" />
    <button type="submit" id="image-submit">Generate</button>
  </form>
  <div id="image-status"></div>
  <div id="image-results"></div>
</main>

<script>
document.getElementById("image-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const prompt = document.getElementById("image-prompt").value.trim();
  if (!prompt) return;
  const submit = document.getElementById("image-submit");
  const status = document.getElementById("image-status");
  const out = document.getElementById("image-results");
  submit.disabled = true;
  status.textContent = "Generating… this can take a minute or more.";
  out.textContent = "";
  try {
    const res = await fetch("/api/image", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt }),
    });
    if (res.status === 401) { location.href = "/login"; return; }
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
    status.textContent = "";
    for (const img of data.images) {
      const el = document.createElement("img");
      el.src = img.src;
      el.alt = prompt;
      out.appendChild(el);
    }
  } catch (err) {
    status.textContent = err.message;
  } finally {
    submit.disabled = false;
  }
});

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/sw.js").catch((err) => console.warn("Service worker registration failed:", err));
  });
}
</script>
</body>
</html>
